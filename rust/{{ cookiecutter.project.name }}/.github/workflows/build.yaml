name: build

on:
  push:
    branches:
      - {{ cookiecutter.branch }}
    tags: ["v*"]
  pull_request:
    branches:
      - {{ cookiecutter.branch }}

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tool: cargo-deny@0.22.1
      - name: Check Rust advisories
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo deny --locked check advisories
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist
      - name: Check tag matches Cargo, package, plugin, cruft, and sdist versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib

          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          cargo = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']
          project_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          claude_version = json.load(open('.claude-plugin/plugin.json'))['version']
          codex_version = json.load(open('.codex-plugin/plugin.json'))['version']
          cruft = json.load(open('.cruft.json'))['context']['cookiecutter']
          versions = {
              'Cargo.toml': cargo['version'],
              'pyproject.toml': project_version,
              '.claude-plugin/plugin.json': claude_version,
              '.codex-plugin/plugin.json': codex_version,
              '.cruft.json': cruft['project']['version'],
          }
          # the surfaces hold one spelling, the one Cargo accepts
          if len(set(versions.values())) != 1:
              detail = ', '.join(f'{name}={v}' for name, v in versions.items())
              raise SystemExit(f'::error::versions differ: {detail}')
          # the sdist is named with the spelling PyPI and the tag use
          sdist = next(pathlib.Path('dist').glob('*.tar.gz'))
          version = sdist.name.removesuffix('.tar.gz').rsplit('-', 1)[1]
          if version != tag:
              raise SystemExit(f'::error::tag v{tag} != sdist version {version}')
          print(f'All versions aligned at v{tag}')
          PY
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Check sdist ships every tracked skill file
        run: |
          export LC_ALL=C
          tracked=$(git ls-files {{ cookiecutter.project.name }} | sort)
          # an empty listing would compare as nothing missing
          if [[ -z "$tracked" ]]; then
            echo "::error::no tracked files under {{ cookiecutter.project.name }}/"
            exit 1
          fi
          # the sdist nests every path under its top folder
          missing=$(comm -23 <(echo "$tracked") <(tar -tzf dist/{{ cookiecutter.project.package | replace('-', '_') }}-*.tar.gz | sed 's|^[^/]*/||' | sort) | sed 's/^/::error::sdist lacks /')
          if [[ -n "$missing" ]]; then
            echo "$missing"
            exit 1
          fi
      # NOTE: the sdist is installed by its file path, so the smoke test
      #   cannot pick up a published release in place of the new build
      - name: Smoke-test installed sdist
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.tar.gz
          smoke/bin/{{ cookiecutter.project.name }} --version
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/smoke/bin/{{ cookiecutter.project.name }}" install --project
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/
  wheels:
    name: wheels ({% raw %}${{ matrix.target }}{% endraw %})
    needs: [build]
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          target: {% raw %}${{ matrix.target }}{% endraw %}
          manylinux: {% raw %}${{ matrix.manylinux }}{% endraw %}
          args: --release --locked --out dist
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Check wheel holds only the binary
        run: |
          entries=$(unzip -Z1 dist/{{ cookiecutter.project.package | replace('-', '_') }}-*.whl | grep -v '\.dist-info/')
          binary=$(echo "$entries" | grep -c '\.data/scripts/{{ cookiecutter.project.name }}$' || true)
          if [[ "$binary" != 1 || "$entries" == *$'\n'* ]]; then
            echo "::error::wheel should hold only the binary, found: $entries"
            exit 1
          fi
      # NOTE: each wheel is installed by its file path, so the smoke test
      #   cannot pick up a published release in place of the new build
      - name: Smoke-test installed wheel
        if: {% raw %}${{ !contains(matrix.target, 'musl') }}{% endraw %}
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/{{ cookiecutter.project.name }} --version
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/smoke/bin/{{ cookiecutter.project.name }}" install --project
      - name: Smoke-test installed wheel on musl
        if: {% raw %}${{ contains(matrix.target, 'musl') }}{% endraw %}
        run: |
          docker run --rm --volume "$PWD/dist:/dist" python:{{ cookiecutter.default_python }}-alpine sh -ec '
            pip install /dist/*.whl
            {{ cookiecutter.project.name }} --version
            cd "$(mktemp -d)"
            {{ cookiecutter.project.name }} install --project
          '
      - uses: actions/upload-artifact@v7
        with:
          name: dist-{% raw %}${{ matrix.target }}{% endraw %}
          path: dist/
  publish:
    name: publish
    needs: [build, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/{{ cookiecutter.project.package }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist/
        merge-multiple: true
    # a rerun after a partial upload skips the files already published
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
