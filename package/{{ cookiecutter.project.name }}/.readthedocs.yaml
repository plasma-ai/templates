version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "{{ cookiecutter.default_python }}"
  jobs:
    post_create_environment:
      - pip install uv
    install:
{%- if cookiecutter.rust_bindings == 'bin' %}
      # the docs import the package from the sources, so the binary is not built
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --no-install-project --all-extras --group docs
{%- else %}
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --all-extras --group docs
{%- endif %}
    pre_build:
      - sphinx-apidoc -f -o docs {{ cookiecutter.project.name }}
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
