name: docs

on:
  push:
    branches:
      - {{ cookiecutter.branch }}
  pull_request:
    branches:
      - {{ cookiecutter.branch }}
{%- if cookiecutter.rust_toolchain %}

env:
  CARGO_BUILD_WARNINGS: deny
{%- endif %}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
{%- if cookiecutter.rust_toolchain %}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: {% raw %}${{ github.ref == 'refs/heads/{% endraw %}{{ cookiecutter.branch }}{% raw %}' }}{% endraw %}
{%- endif %}
      - name: Install package with docs dependencies
        run: ./install.sh --all-extras --groups=docs
      - name: Generate API docs
        run: uv run --no-sync sphinx-apidoc -f -o docs {{ cookiecutter.project.name }}
      - name: Build docs
        run: uv run --no-sync sphinx-build -W docs docs/_build
{%- if cookiecutter.rust_toolchain %}
      - name: Build Rust docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
{%- endif %}
