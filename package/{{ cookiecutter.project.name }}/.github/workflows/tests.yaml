name: tests

on:
  push:
    branches:
      - {{ cookiecutter.branch }}
  pull_request:
    branches:
      - {{ cookiecutter.branch }}
{%- if cookiecutter.rust_toolchain %}

env:
  CARGO_BUILD_WARNINGS: deny
{%- endif %}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
{%- if cookiecutter.rust_bindings == 'bin' %}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: {% raw %}${{ github.ref == 'refs/heads/{% endraw %}{{ cookiecutter.branch }}{% raw %}' }}{% endraw %}
{%- endif %}
      - name: Install package with test dependencies
        run: ./install.sh --all-extras --groups=test
      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=xml
      - name: Report coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
{%- if cookiecutter.rust_toolchain %}
  rust:
    name: rust
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: {% raw %}${{ github.ref == 'refs/heads/{% endraw %}{{ cookiecutter.branch }}{% raw %}' }}{% endraw %}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152,cargo-llvm-cov@0.9.2
      - name: Run Rust tests
        run: cargo llvm-cov nextest --workspace --all-targets --all-features --locked --profile ci --lcov --output-path lcov.info
      - name: Run Rust doctests
        run: cargo test --workspace --doc --all-features --locked
      - name: Report Rust coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          flags: rust
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
{%- endif %}
