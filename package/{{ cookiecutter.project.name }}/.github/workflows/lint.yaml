name: lint

on:
  push:
    branches:
      - {{ cookiecutter.branch }}
  pull_request:
    branches:
      - {{ cookiecutter.branch }}
{%- if cookiecutter.rust.toolchain %}
  schedule:
    - cron: "0 6 * * 1"
{%- endif %}
{%- if cookiecutter.rust.toolchain %}

env:
  CARGO_BUILD_WARNINGS: deny
{%- endif %}

jobs:
  lint:
    name: lint
{%- if cookiecutter.rust.toolchain %}
    if: github.event_name != 'schedule'
{%- endif %}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
{%- if cookiecutter.rust.toolchain %}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: {% raw %}${{ github.ref == 'refs/heads/{% endraw %}{{ cookiecutter.branch }}{% raw %}' }}{% endraw %}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1,cargo-shear@1.14.1
{%- endif %}
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: {% raw %}pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}{% endraw %}
      - name: Install package with lint dependencies
        run: ./install.sh --groups=lint
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Check that project is up-to-date with template
        run: uv run --no-sync cruft check
      - name: Reject forbidden file patterns
        run: test -z "$(find . -name "*.rej" -print -quit)" || exit 1
{%- if cookiecutter.rust.toolchain %}
      - name: Check Rust supply chain
        run: |
          cargo deny --locked check bans licenses sources
          cargo shear --locked
  advisories:
    name: advisories
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1
      - name: Check Rust advisories
        run: cargo deny --locked check advisories
{%- endif %}
